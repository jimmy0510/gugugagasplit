# Supabase 免費方案：專案 7 天沒有足夠活動就會被自動暫停。
# 每三天打一次 PostgREST，讓資料庫真的跑一次查詢，算進活動量。
#
# 用的是公開的 publishable key（eas.json 裡本來就有，repo 是公開的），
# 只做 select，RLS 下匿名身分讀不到任何列——要的只是「有請求進來」。
#
# 注意：GitHub 會在 repo 60 天沒有任何 commit 時自動停用排程 workflow，
# 到時候 Actions 頁面會有提示，按一下重新啟用即可。
name: Supabase keep-alive

on:
  schedule:
    - cron: '23 1 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: https://ielczttxqhgmpefbolvb.supabase.co
          SUPABASE_KEY: sb_publishable_7N33sjVdcGN_qMyLYcnZOQ_Em74n49h
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/rest/v1/groups?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")
          echo "HTTP $status"
          # 失敗就讓 job 變紅，GitHub 會寄信通知——那通常代表專案已經被暫停了
          test "$status" = 200
