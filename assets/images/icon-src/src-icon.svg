<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="70 30 240 240">
<defs>
    <!-- 臘腸以「還沒切開」的完整餅面座標定義：間距 24px 的交錯格點，
         每顆再加 ±3px 以內的人為誤差，像有人想擺整齊但沒擺準。
         每一片切片各自 use 這組並套上自己的位移，再被自己的形狀裁掉，
         所以刀口切到誰是刀線與臘腸各自獨立的結果。 -->
    <g id="pep" fill="#E08B62">
      <circle cx="144" cy="148" r="7"/>
      <circle cx="165" cy="152" r="7"/>
      <circle cx="192" cy="151" r="7"/>
      <circle cx="212" cy="148" r="7"/>
      <circle cx="239" cy="152" r="7"/>
      <circle cx="155" cy="131.2" r="7"/>
      <circle cx="176" cy="128.2" r="7"/>
      <circle cx="204" cy="131.2" r="7"/>
      <circle cx="225" cy="132.2" r="7"/>
      <circle cx="152" cy="171.8" r="7"/>
      <circle cx="180" cy="168.8" r="7"/>
      <circle cx="201" cy="172.8" r="7"/>
      <circle cx="229" cy="169.8" r="7"/>
      <circle cx="168" cy="111.4" r="7"/>
      <circle cx="188" cy="106.4" r="7"/>
      <circle cx="215" cy="110.4" r="7"/>
      <circle cx="164" cy="189.6" r="7"/>
      <circle cx="192" cy="193.6" r="7"/>
      <circle cx="213" cy="194.6" r="7"/>
    </g>

    <clipPath id="clipA">
      <path d="M 201.64,129.01 L 184.54,65.21 A 66 66 0 0 1 264.74,109.71 Z"/>
    </clipPath>
    <clipPath id="clipB">
      <path d="M 196.04,151.50 L 259.14,132.20 A 66 66 0 0 1 242.74,198.20 Z"/>
    </clipPath>
    <clipPath id="clipC">
      <path d="M 189.88,154.42 L 236.58,201.12 A 66 66 0 0 1 140.88,198.62 Z"/>
    </clipPath>
    <clipPath id="clipD">
      <path d="M 186.40,148.93 L 137.40,193.13 A 66 66 0 0 1 169.30,85.13 Z"/>
    </clipPath>

    <!-- 四片餅面加四組裁切後的臘腸。B、C、D 先畫，被抽出來的 A 片最後畫、疊在最上層。 -->
    <g id="pizza">
      <path d="M 196.04,151.50 L 259.14,132.20 A 66 66 0 0 1 242.74,198.20 Z"
            fill="#F5D98F" stroke="#E9C46F" stroke-width="2.5" stroke-linejoin="round"/>
      <g clip-path="url(#clipB)"><use href="#pep" transform="translate(6.04 1.50)"/></g>

      <path d="M 189.88,154.42 L 236.58,201.12 A 66 66 0 0 1 140.88,198.62 Z"
            fill="#F5D98F" stroke="#E9C46F" stroke-width="2.5" stroke-linejoin="round"/>
      <g clip-path="url(#clipC)"><use href="#pep" transform="translate(-0.12 4.42)"/></g>

      <path d="M 186.40,148.93 L 137.40,193.13 A 66 66 0 0 1 169.30,85.13 Z"
            fill="#F5D98F" stroke="#E9C46F" stroke-width="2.5" stroke-linejoin="round"/>
      <g clip-path="url(#clipD)"><use href="#pep" transform="translate(-3.60 -1.07)"/></g>

      <path d="M 201.64,129.01 L 184.54,65.21 A 66 66 0 0 1 264.74,109.71 Z"
            fill="#F5D98F" stroke="#E9C46F" stroke-width="2.5" stroke-linejoin="round"/>
      <g clip-path="url(#clipA)"><use href="#pep" transform="translate(11.64 -20.99)"/></g>
    </g>
  </defs>
  <rect x="70" y="30" width="240" height="240" fill="#FBF0CE"/>
  <use href="#pizza"/>
</svg>
